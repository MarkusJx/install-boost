name: Lint

on:
  push:

jobs:
  check-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run prettier:check
